<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英语朗读练习</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #e8f4ff, #d4ecff);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 16px;
  }
  #app { width: 100%; max-width: 480px; }
  section { margin-top: 24px; }
  h1 { font-size: 26px; color: #1e5a8a; text-align: center; }
  .sub { text-align: center; color: #5b7fa0; margin: 8px 0 20px; }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 16px rgba(30, 90, 138, .12);
    margin-top: 12px;
  }
  label { display: block; color: #456; font-size: 14px; margin-bottom: 12px; }
  input, select {
    width: 100%;
    margin-top: 6px;
    padding: 12px;
    font-size: 16px;
    border: 2px solid #cfe3f5;
    border-radius: 10px;
    outline: none;
  }
  input:focus, select:focus { border-color: #4a9ede; }
  button {
    width: 100%;
    padding: 14px;
    font-size: 17px;
    border: none;
    border-radius: 12px;
    background: #4a9ede;
    color: #fff;
    cursor: pointer;
    margin-top: 8px;
  }
  button:disabled { background: #b9cfdf; cursor: not-allowed; }
  button.secondary { background: #7fb8e6; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row button { flex: 1; }
  .hidden { display: none !important; }
  .topbar {
    display: flex;
    justify-content: space-between;
    color: #1e5a8a;
    font-size: 15px;
    padding: 0 4px;
    margin-bottom: 4px;
  }
  .sentence {
    font-size: 22px;
    line-height: 1.5;
    color: #234;
    text-align: center;
    padding: 10px 0 16px;
    min-height: 60px;
  }
  .msg { color: #c66; font-size: 14px; text-align: center; margin-top: 10px; min-height: 20px; }
  .score { text-align: center; font-size: 18px; color: #456; margin: 12px 0 8px; }
  .score b { font-size: 26px; color: #e8922f; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 8px 0; }
  .chip {
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 17px;
    color: #fff;
    cursor: pointer;
    user-select: none;
  }
  .chip.w-good { background: #52b96c; }
  .chip.w-mid  { background: #e8b53a; }
  .chip.w-bad  { background: #e25f5f; }
  .tip { color: #8aa; font-size: 12px; text-align: center; margin: 4px 0 10px; }
  .recording { animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { background: #4a9ede; } 50% { background: #e25f5f; } }
  .big-score { text-align: center; font-size: 20px; color: #456; margin-top: 12px; }
  .big-score b { font-size: 40px; color: #e8922f; }
  #final-list { list-style: none; margin: 16px 0; }
  #final-list li {
    background: #fff;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 14px;
    color: #345;
    box-shadow: 0 2px 8px rgba(30,90,138,.08);
  }
</style>
</head>
<body>
<div id="app">

  <section id="step-enter">
    <h1>英语朗读练习</h1>
    <p class="sub">跟着示范读，AI 给你的发音打分</p>
    <div class="card">
      <label>作业码
        <input id="code-input" inputmode="numeric" placeholder="老师发的 4 位作业码">
      </label>
      <label>你的名字
        <select id="name-select"><option value="">先输入作业码</option></select>
      </label>
      <button id="btn-enter">开始练习</button>
      <p id="enter-msg" class="msg"></p>
    </div>
  </section>

  <section id="step-practice" class="hidden">
    <div class="topbar">
      <span id="title-display"></span>
      <span id="progress"></span>
    </div>
    <div class="card">
      <p class="sentence" id="sentence-text"></p>
      <div class="btn-row">
        <button id="listen-btn" class="secondary">听示范</button>
        <button id="record-btn">开始录音</button>
      </div>
      <p id="status" class="msg"></p>
      <div id="result-area" class="hidden">
        <p class="score">得分 <b id="score-total"></b></p>
        <div id="word-chips" class="chips"></div>
        <p class="tip">点单词听发音 · 绿色=好 黄色=一般 红色=需练习</p>
        <div class="btn-row">
          <button id="retry-btn" class="secondary">再读一遍</button>
          <button id="next-btn">下一句</button>
        </div>
      </div>
    </div>
  </section>

  <section id="step-done" class="hidden">
    <h1>练习完成！</h1>
    <p class="big-score">总分 <b id="final-score"></b></p>
    <p id="final-msg" class="msg"></p>
    <ul id="final-list"></ul>
    <button id="btn-restart" class="secondary">再练一次</button>
  </section>

</div>
<script src="config.js"></script>
<script src="student.js"></script>
</body>
</html>
