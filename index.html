<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doris的英语朗读妙妙屋</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #fff3e2, #ffe2ec);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 16px;
  }
  #app { width: 100%; max-width: 480px; }
  section { margin-top: 24px; }
  h1 { font-size: 28px; color: #e2703f; text-align: center; font-weight: 700; }
  .sub { text-align: center; color: #c98a5e; margin: 8px 0 20px; }
  .card {
    background: #fff;
    border-radius: 22px;
    padding: 20px;
    box-shadow: 0 4px 16px rgba(226, 112, 63, .14);
    margin-top: 12px;
  }
  label { display: block; color: #8a6a4f; font-size: 14px; margin-bottom: 12px; }
  input, select, textarea {
    width: 100%;
    margin-top: 6px;
    padding: 12px;
    font-size: 16px;
    border: 2px solid #f5d9c4;
    border-radius: 12px;
    outline: none;
    font-family: inherit;
  }
  textarea { resize: vertical; }
  input:focus, select:focus, textarea:focus { border-color: #ff9a5c; }
  button {
    width: 100%;
    padding: 14px;
    font-size: 17px;
    border: none;
    border-radius: 14px;
    background: #ff8a5c;
    color: #fff;
    cursor: pointer;
    margin-top: 8px;
    font-weight: 600;
  }
  button:disabled { background: #e9d3c3; cursor: not-allowed; }
  button.secondary { background: #8ec5ef; }
  button.btn-small { width: auto; padding: 8px 18px; font-size: 14px; border-radius: 20px; }
  .btn-small-wrap { text-align: center; margin-top: 14px; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row button { flex: 1; }
  .hidden { display: none !important; }
  .topbar {
    display: flex;
    justify-content: space-between;
    color: #c25e33;
    font-size: 15px;
    padding: 0 4px;
    margin-bottom: 4px;
  }
  .sentence {
    font-size: 24px;
    line-height: 1.5;
    color: #4a3a2c;
    text-align: center;
    padding: 10px 0 16px;
    min-height: 60px;
  }
  .msg { color: #c66; font-size: 14px; text-align: center; margin-top: 10px; min-height: 20px; }
  .score { text-align: center; font-size: 18px; color: #8a6a4f; margin: 12px 0 8px; }
  .score b { font-size: 26px; color: #f2773f; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 8px 0; }
  .chip {
    padding: 8px 14px;
    border-radius: 22px;
    font-size: 17px;
    color: #fff;
    cursor: pointer;
    user-select: none;
  }
  .chip.w-good { background: #4caf6d; }
  .chip.w-mid  { background: #f0b429; }
  .chip.w-bad  { background: #e25f5f; }
  .chip.w-extra { background: #b9a088; }
  .pause-mark { color: #c98a5e; font-size: 15px; font-weight: bold; margin: 0 2px; white-space: nowrap; }
  .repeat-mark { color: #e08a3c; font-size: 15px; font-weight: bold; margin: 0 2px; white-space: nowrap; }
  .dims-row { display: flex; gap: 8px; justify-content: center; margin: 8px 0 2px; flex-wrap: wrap; }
  .dim { background: #fff3e6; border-radius: 16px; padding: 3px 12px; font-size: 13px; color: #8a6a4f; }
  .dim b { color: #f2773f; font-size: 15px; }
  .phone-detail { background: #fff8ee; border: 1px solid #f0d9b8; border-radius: 12px; padding: 10px 12px; margin: 8px 0; }
  .phone-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 15px; color: #4a3a2c; }
  .phone-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 4px 0; }
  .phone-row .chip { padding: 4px 10px; font-size: 13px; }
  .phone { padding: 3px 10px; border-radius: 14px; font-size: 13px; color: #fff; }
  .phone.p-good { background: #4caf6d; }
  .phone.p-mid  { background: #f0b429; cursor: help; }
  .phone.p-bad  { background: #e25f5f; cursor: help; }
  .tip { color: #b08a6a; font-size: 12px; text-align: center; margin: 4px 0 10px; }
  .recording { animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { background: #ff8a5c; } 50% { background: #e25f5f; } }
  .big-score { text-align: center; font-size: 20px; color: #8a6a4f; margin-top: 12px; }
  .big-score b { font-size: 40px; color: #f2773f; }
  #final-list { list-style: none; margin: 16px 0; }
  #final-list li {
    background: #fff;
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 14px;
    color: #4a3a2c;
    box-shadow: 0 2px 8px rgba(226,112,63,.1);
  }
</style>
</head>
<body>
<div id="app">

  <section id="step-enter">
    <h1>Doris的英语朗读妙妙屋</h1>
    <p class="sub">和 Doris 一起读英语，AI 小老师帮你打分加油！</p>
    <div class="card">
      <label>作业码
        <input id="code-input" inputmode="numeric" placeholder="老师发的 4 位作业码">
      </label>
      <label>你的名字（先点一下输入框再选，也可以直接打字）
        <input id="name-input" list="name-list" autocomplete="off" placeholder="先输入作业码">
      </label>
      <button id="btn-enter">开始练习</button>
      <p id="enter-msg" class="msg"></p>
    </div>
    <div class="btn-small-wrap">
      <button id="btn-feedback" class="btn-small secondary">给老师留言</button>
    </div>
  </section>

  <section id="step-practice" class="hidden">
    <div class="topbar">
      <span id="title-display"></span>
      <span id="progress"></span>
    </div>
    <div class="card">
      <p class="sentence" id="sentence-text"></p>
      <div class="btn-row">
        <button id="listen-btn" class="secondary">听示范</button>
        <button id="record-btn">开始录音</button>
      </div>
      <p id="status" class="msg"></p>
      <div id="result-area" class="hidden">
        <p class="score">得分 <b id="score-total"></b></p>
        <div id="dims-row" class="dims-row hidden"></div>
        <div id="word-chips" class="chips"></div>
        <div id="phone-detail" class="phone-detail hidden"></div>
        <p class="tip">点单词看音素讲解 · 绿色=真棒 黄色=加油 红色=再练练</p>
        <div class="btn-row">
          <button id="retry-btn" class="secondary">再读一遍</button>
          <button id="next-btn">下一句</button>
        </div>
      </div>
    </div>
  </section>

  <section id="step-done" class="hidden">
    <h1>练习完成！</h1>
    <p class="big-score">总分 <b id="final-score"></b></p>
    <p id="final-msg" class="msg"></p>
    <ul id="final-list"></ul>
    <button id="btn-restart" class="secondary">再练一次</button>
  </section>

  <section id="step-feedback" class="hidden">
    <h1>给老师留言</h1>
    <p class="sub">悄悄话会直接送到老师的后台，只有老师能看到哦</p>
    <div class="card">
      <label>作业码
        <input id="fb-code-input" inputmode="numeric" placeholder="老师发的 4 位作业码">
      </label>
      <label>你的名字
        <input id="fb-name-input" list="name-list" autocomplete="off" placeholder="先输入作业码">
      </label>
      <label>想对老师说的话
        <textarea id="fb-text" rows="4" placeholder="写点什么吧…"></textarea>
      </label>
      <button id="btn-fb-send">发给老师</button>
      <button id="btn-fb-back" class="secondary">返回</button>
      <p id="fb-msg" class="msg"></p>
    </div>
  </section>

</div>
<datalist id="name-list"></datalist>
<script src="config.js"></script>
<script src="student.js"></script>
</body>
</html>
