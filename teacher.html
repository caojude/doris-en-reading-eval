<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doris的英语朗读妙妙屋 · 教师后台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #fdf6ee;
    color: #4a3a2c;
    max-width: 900px;
    margin: 0 auto;
    padding: 16px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
  }
  header h1 { font-size: 20px; color: #d2602f; }
  header label { font-size: 14px; color: #8a6a4f; }
  header input {
    margin-left: 6px;
    padding: 8px 10px;
    border: 2px solid #f0ddc8;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  nav { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab-btn {
    flex: 1;
    padding: 12px;
    font-size: 15px;
    border: none;
    border-radius: 10px;
    background: #f5e6d3;
    color: #8a6a4f;
    cursor: pointer;
  }
  .tab-btn.active { background: #ff8a5c; color: #fff; }
  section { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 2px 10px rgba(210,96,47,.08); }
  .hidden { display: none !important; }
  h2 { font-size: 17px; color: #d2602f; margin-bottom: 14px; }
  h3 { font-size: 15px; color: #d2602f; margin: 18px 0 8px; }
  label { display: block; font-size: 14px; color: #8a6a4f; margin-bottom: 12px; }
  input, textarea, select {
    width: 100%;
    margin-top: 6px;
    padding: 10px;
    font-size: 14px;
    border: 2px solid #f0ddc8;
    border-radius: 8px;
    outline: none;
    font-family: inherit;
  }
  input:focus, textarea:focus, select:focus { border-color: #ff9a5c; }
  textarea { line-height: 1.6; }
  button {
    padding: 10px 18px;
    font-size: 14px;
    border: none;
    border-radius: 8px;
    background: #ff8a5c;
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: #f5773f; }
  button.danger { background: #e25f5f; }
  button.danger:hover { background: #cf4f4f; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row input, .row select { flex: 1; margin-top: 0; }
  .msg { color: #c66; font-size: 14px; margin-top: 10px; min-height: 20px; }
  .msg.ok { color: #3a9d5d; }
  .muted { color: #a08a72; font-size: 12px; margin-top: 6px; }
  .cards { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
  .stat-card {
    flex: 1;
    min-width: 120px;
    background: #fff3e6;
    border-radius: 10px;
    padding: 12px;
    text-align: center;
  }
  .stat-card b { display: block; font-size: 22px; color: #d2602f; }
  .stat-card span { font-size: 12px; color: #a08a72; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border: 1px solid #f0e0cc; padding: 8px 10px; text-align: center; }
  th { background: #fff0e0; color: #b85a2a; }
  .sent-item { margin-bottom: 14px; }
  .sent-text { font-size: 15px; color: #4a3a2c; margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 5px 12px;
    border-radius: 14px;
    font-size: 14px;
    color: #fff;
  }
  .chip.w-good { background: #52b96c; }
  .chip.w-mid  { background: #e8b53a; }
  .chip.w-bad  { background: #e25f5f; }
  .chip i { font-style: normal; font-size: 11px; opacity: .9; margin-left: 4px; }
  .class-checks { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .class-checks label {
    display: flex; align-items: center; gap: 6px;
    background: #fff3e6; padding: 8px 12px; border-radius: 10px; margin: 0;
  }
  .class-checks input { margin: 0; width: auto; }
  .item-list { margin-top: 10px; }
  .item-row {
    display: flex; align-items: center; gap: 10px;
    background: #fff3e6; border-radius: 10px; padding: 10px 14px; margin-bottom: 8px;
  }
  .item-row .meta { flex: 1; font-size: 13px; color: #8a6a4f; }
  .item-row .meta b { color: #b85a2a; }
  .item-row button { padding: 6px 12px; font-size: 13px; flex-shrink: 0; }
  .class-tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .class-tabs button { padding: 8px 14px; font-size: 13px; background: #f5e6d3; color: #8a6a4f; }
  .class-tabs button.active { background: #ff8a5c; color: #fff; }
  .fb-item { background: #fff3e6; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .fb-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .fb-name { font-weight: 600; color: #b85a2a; }
  .fb-time { color: #a08a72; font-size: 12px; flex: 1; }
  .fb-head button { padding: 5px 10px; font-size: 12px; }
  .fb-text { font-size: 14px; color: #4a3a2c; white-space: pre-wrap; word-break: break-word; }
  button.secondary { background: #b9a088; }
  button.secondary:hover { background: #a68d74; }
  #login-gate {
    position: fixed; inset: 0; z-index: 20;
    background: linear-gradient(160deg, #fff3e2, #ffe2ec);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .gate-card {
    background: #fff; border-radius: 18px; padding: 30px 26px;
    box-shadow: 0 6px 24px rgba(226,112,63,.18);
    width: 100%; max-width: 340px; text-align: center;
  }
  .gate-card h1 { font-size: 20px; color: #d2602f; margin-bottom: 6px; }
  .gate-sub { font-size: 13px; color: #a08a72; margin-bottom: 16px; }
  .gate-card input {
    width: 100%; margin: 0 0 12px; padding: 12px; font-size: 15px;
    border: 2px solid #f0ddc8; border-radius: 10px; outline: none;
  }
  .gate-card input:focus { border-color: #ff9a5c; }
  .gate-card button { width: 100%; padding: 12px; font-size: 15px; }
</style>
</head>
<body>
<div id="login-gate">
  <div class="gate-card">
    <h1>Doris的英语朗读妙妙屋</h1>
    <p class="gate-sub">教师后台 · 请输入管理密码</p>
    <input id="gate-pw" type="password" placeholder="管理密码">
    <button id="btn-gate-enter">进入后台</button>
    <p id="gate-msg" class="msg"></p>
  </div>
</div>
<header>
  <h1>Doris的英语朗读妙妙屋 · 教师后台</h1>
</header>
<nav>
  <button class="tab-btn active" data-tab="tab-publish">发布作业</button>
  <button class="tab-btn" data-tab="tab-class">班级管理</button>
  <button class="tab-btn" data-tab="tab-report">学情报告</button>
  <button class="tab-btn" data-tab="tab-feedback">留言板</button>
</nav>
<main>
  <section id="tab-publish">
    <h2>发布新作业</h2>
    <label>作业码（学生输入的数字）
      <div class="row">
        <input id="pub-code" inputmode="numeric" maxlength="10" placeholder="如 1234">
        <button id="btn-gen" type="button">随机生成</button>
      </div>
    </label>
    <label>作业标题 <input id="pub-title" placeholder="如：Unit 1 第 3 课"></label>
    <label>课文内容（把课本句子粘贴进来，一句一行，句末带标点，程序会自动按句切分）
      <textarea id="pub-text" rows="10" placeholder="Hello, I'm Mike.&#10;What's your name?&#10;Nice to meet you."></textarea>
    </label>
    <label>发给哪些班级？（可多选；先在"班级管理"里建好班级和名单）
      <div id="pub-classes" class="class-checks"></div>
    </label>
    <button id="btn-publish">发布作业</button>
    <button id="btn-cancel-edit" type="button" class="secondary hidden">取消编辑</button>
    <p id="pub-msg" class="msg"></p>
    <h3>历次作业（可查看报告 / 编辑再发布 / 删除）</h3>
    <div id="pub-history" class="item-list"></div>
  </section>

  <section id="tab-class" class="hidden">
    <h2>班级管理</h2>
    <p class="muted">一个作业可以发给多个班级，统计按班级分开。删掉班级后，用它的作业里就不再显示这个班。</p>
    <div class="row">
      <input id="class-new-name" placeholder="新班级名称，如：三（1）班">
      <button id="btn-class-create" type="button">新建班级</button>
    </div>
    <p id="class-msg" class="msg"></p>
    <div id="class-list" class="item-list"></div>
    <div id="class-edit" class="hidden">
      <h3 id="class-edit-title"></h3>
      <textarea id="class-roster-input" rows="12" placeholder="一行一个名字&#10;张三&#10;李四&#10;王五"></textarea>
      <button id="btn-class-roster">保存名单</button>
      <p id="class-roster-msg" class="msg"></p>
    </div>
  </section>

  <section id="tab-feedback" class="hidden">
    <h2>学生留言板（实名留言，老师可删除单条）</h2>
    <div class="row">
      <select id="feedback-select"></select>
      <button id="btn-feedback-refresh" type="button">刷新</button>
    </div>
    <p id="feedback-msg" class="msg"></p>
    <div id="feedback-list" class="item-list"></div>
  </section>

  <section id="tab-report" class="hidden">
    <h2>学情报告（历次作业都保留在这里）</h2>
    <div class="row">
      <select id="report-select"></select>
      <button id="btn-refresh" type="button">刷新</button>
      <button id="btn-delete" type="button" class="danger">删除此作业</button>
    </div>
    <p class="muted">删除作业后，学生端的对应链接作废，成绩数据也会一并删除。</p>
    <p id="report-msg" class="msg"></p>
    <div id="class-tabs" class="class-tabs"></div>
    <p id="report-class-name" class="muted"></p>
    <div id="report-summary" class="cards"></div>
    <button id="btn-csv">导出表格（Excel 可打开）</button>
    <h3>学生明细</h3>
    <div class="table-wrap"><table id="student-table"></table></div>
    <h3>逐句错误统计（红色的词 = 全班错得多的词，就是你的教学重点）</h3>
    <div id="sentence-stats"></div>
    <p id="unfinished" class="msg"></p>
  </section>
</main>
<script src="config.js"></script>
<script src="teacher.js"></script>
</body>
</html>
